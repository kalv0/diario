# Nombre fijo del proyecto: si no, Docker lo saca del nombre del directorio y
# los volúmenes cambian de nombre según dónde se haya clonado el repo.
name: diario

services:
  app:
    build: .
    image: diario:latest
    container_name: diario
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/diario.db"
      SESSION_SECRET: "${SESSION_SECRET:?Falta SESSION_SECRET en el archivo .env}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      # Dominio público desde el que se sirve: sin él Next rechaza las server
      # actions (el login) porque Cloudflare reescribe el Host y el origen
      # deja de coincidir.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      PORT: "1312"
      USERS_FILE: "/app/.users"
    volumes:
      # Aquí vive el SQLite. Es lo único que hay que respaldar.
      - diario-data:/data
      # Cuentas del diario. Se leen en cada arranque: para dar de alta a alguien,
      # se edita este fichero en el servidor y se reinicia el contenedor.
      - ./.users:/app/.users:ro
    networks:
      - cloudflare
    # No se publica ningún puerto en el host: al contenedor solo se llega desde
    # la red `cloudflare`. Descomenta para probar en local sin túnel.
    # ports:
    #   - "1312:1312"
    expose:
      - "1312"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1312/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  diario-data:

networks:
  # Red compartida donde ya corre el túnel de Cloudflare. La gestiona el
  # servidor, no este compose: aquí solo nos enganchamos a ella.
  cloudflare:
    external: true
