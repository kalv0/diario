services:
  app:
    build: .
    image: diario-de-situaciones:latest
    container_name: diario
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/diario.db"
      SESSION_SECRET: "${SESSION_SECRET:?Falta SESSION_SECRET en el archivo .env}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      # Dominio público del túnel: sin él Next rechaza las server actions
      # (el login) porque el Host no coincide con el origen.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      PORT: "3000"
    volumes:
      # Aquí vive el SQLite. Es lo único que hay que respaldar.
      - diario-data:/data
    networks:
      - diario
    # La app no publica puertos al host: solo la alcanza cloudflared por la red
    # interna. Descomenta si quieres probarla en local sin el túnel.
    # ports:
    #   - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: diario-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN en el archivo .env}"
    depends_on:
      app:
        condition: service_started
    networks:
      - diario

volumes:
  diario-data:

networks:
  diario:
